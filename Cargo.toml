[package]
name = "rispy"
version = "0.1.0"
authors = ["meris bahti"]
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Core dependencies (work on all platforms)
[dependencies]
nom = "7.1.0"
nom_locate = "4.2.0"
once_cell = "1.19.0"
include_dir = "0.7.4"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
cfg-if = "1.0.0"
web-sys = "0.3.69"
wasm-bindgen = "0.2.79"
yew = { version = "0.20", features = ["csr"] }
gloo = "0.11.0"
gloo-console = "0.3.0"
gloo-events = "0.2.0"

# Native (non-WASM) dependencies — used by the LSP server binary
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3.13"

[[bin]]
name = "rispy-lsp"
path = "src/bin/rispy-lsp.rs"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"

[features]
# default = ["console_error_panic_hook" ,"wee_alloc"]
